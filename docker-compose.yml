services:
  postgres:
    image: postgres:18.4-bookworm
    pull_policy: never
    environment:
      POSTGRES_USER: shortener_test
      POSTGRES_DB: shortener_test
      # Local test database only; the published port is restricted to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener_test -d shortener_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
